name: QM Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: qm-scanner
  cancel-in-progress: false

jobs:
  qm-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run QM scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python qm_scanner.py

      - name: Commit QM state
        if: always()
        run: |
          if [ -f state/qm_sent_signals.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/qm_sent_signals.json
            if ! git diff --cached --quiet; then
              git commit -m "Update QM scanner state"
              git push
            else
              echo "QM state unchanged."
            fi
          else
            echo "QM state file not found; nothing to commit."
          fi
